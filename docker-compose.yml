services:
  mysql:
    image: mysql:8.4
    container_name: skillforge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skillforge
      MYSQL_USER: skillforge
      MYSQL_PASSWORD: skillforge_dev
    ports:
      - "3306:3306"
    volumes:
      - skillforge_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  skillforge_mysql_data:
